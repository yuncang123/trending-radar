name: Publish release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and check out version tag
        id: version
        shell: bash
        run: |
          tag="$(node -p "require('./manifest.json').version")"
          git rev-parse --verify "refs/tags/$tag"
          git checkout --detach "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Rebuild release bundle
        run: npm run build

      - name: Verify checked-in release assets
        run: git diff --exit-code -- manifest.json main.js styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            manifest.json main.js styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Trending Radar $RELEASE_TAG" \
            --generate-notes
